<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>امتحان البرمجة والذكاء الاصطناعي - تانية بكالوريا (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#122A4E;
    --navy-2:#1C3A66;
    --paper:#EEF2F8;
    --card:#FFFFFF;
    --ink:#132038;
    --ink-soft:#5B6B85;
    --line:#DCE3EE;
    --mcq:#2F6FED;
    --tf:#0FA88A;
    --term:#7B4FE0;
    --good:#1F9D6B;
    --good-bg:#E6F7EF;
    --bad:#D8465F;
    --bad-bg:#FCEBEE;
    --amber:#E68A1C;
    --shadow: 0 10px 30px rgba(18,42,78,0.08);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --navy:#0B1830;
      --navy-2:#13284A;
      --paper:#0E1526;
      --card:#151F35;
      --ink:#EAF0FB;
      --ink-soft:#94A3C0;
      --line:#28324B;
      --good-bg:#0E2C22;
      --bad-bg:#2E1620;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --navy:#0B1830;
    --navy-2:#13284A;
    --paper:#0E1526;
    --card:#151F35;
    --ink:#EAF0FB;
    --ink-soft:#94A3C0;
    --line:#28324B;
    --good-bg:#0E2C22;
    --bad-bg:#2E1620;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    line-height:1.7;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px;}

  /* Header */
  .hero{
    background:linear-gradient(135deg,var(--navy) 0%, var(--navy-2) 100%);
    border-radius:20px;
    padding:26px 22px;
    color:#fff;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 90% -10%, rgba(47,111,237,0.35), transparent 55%),
      radial-gradient(circle at -10% 110%, rgba(15,168,138,0.30), transparent 50%);
    pointer-events:none;
  }
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1;flex-wrap:wrap;}
  .badge{
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.25);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
  }
  .hero h1{
    font-size:clamp(22px,5vw,30px);
    font-weight:800;
    margin:14px 0 6px;
    position:relative;z-index:1;
  }
  .hero p{
    margin:0;
    color:rgba(255,255,255,0.82);
    font-size:15px;
    position:relative;z-index:1;
  }
  .teacher-line{
    margin-top:16px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    padding:8px 14px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    position:relative;z-index:1;
  }

  /* Cards */
  .card{
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:20px;
    margin-top:18px;
  }
  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:700;margin-bottom:8px;font-size:14.5px;}
  .field input[type="text"], .field input[type="tel"]{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--mcq);}
  .branch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .branch-opt{
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:14px 8px;
    text-align:center;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
    background:var(--paper);
    transition:all .15s;
    user-select:none;
  }
  .branch-opt.selected{
    border-color:var(--mcq);
    background:color-mix(in srgb, var(--mcq) 12%, var(--paper));
    color:var(--mcq);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--mcq);
    color:#fff;
    border:none;
    padding:15px 22px;
    border-radius:12px;
    font-family:inherit;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
    width:100%;
    transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.07);}
  .btn:active{transform:scale(0.99);}
  .btn.secondary{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
  .btn.tf{background:var(--tf);}
  .btn.term{background:var(--term);}
  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .btn-row .btn{width:auto;flex:1;}
  .error-msg{
    color:var(--bad);
    background:var(--bad-bg);
    border-radius:10px;
    padding:10px 14px;
    font-size:14px;
    font-weight:700;
    margin-top:10px;
    display:none;
  }

  /* Section headers */
  .section-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin:26px 0 4px;
  }
  .section-head .dot{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;flex:none;color:#fff;font-weight:800;
  }
  .section-head h2{font-size:17px;margin:0;font-weight:800;}
  .section-head .count{
    margin-inline-start:auto;
    font-size:12.5px;color:var(--ink-soft);font-weight:700;
    background:var(--paper);border:1px solid var(--line);
    padding:4px 10px;border-radius:999px;
  }
  .dot.mcq{background:var(--mcq);}
  .dot.tf{background:var(--tf);}
  .dot.term{background:var(--term);}

  /* Questions */
  .q-card{
    background:var(--card);
    border:1px solid var(--line);
    border-inline-start:5px solid var(--mcq);
    border-radius:14px;
    padding:18px;
    margin-top:12px;
    box-shadow:var(--shadow);
  }
  .q-card.tf{border-inline-start-color:var(--tf);}
  .q-card.term{border-inline-start-color:var(--term);}
  .q-num{
    font-size:12.5px;font-weight:800;color:var(--ink-soft);
    margin-bottom:6px;
  }
  .q-text{font-size:15.5px;font-weight:700;margin-bottom:14px;}
  .opts{display:flex;flex-direction:column;gap:9px;}
  .opt{
    border:1.5px solid var(--line);
    border-radius:11px;
    padding:12px 14px;
    cursor:pointer;
    font-size:14.5px;
    font-weight:600;
    background:var(--paper);
    transition:all .12s;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .opt .circle{
    width:20px;height:20px;border-radius:50%;
    border:2px solid var(--line);
    flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .opt .circle::after{content:"";width:10px;height:10px;border-radius:50%;background:transparent;}
  .opt.selected{border-color:var(--mcq);background:color-mix(in srgb, var(--mcq) 10%, var(--paper));}
  .opt.selected .circle{border-color:var(--mcq);}
  .opt.selected .circle::after{background:var(--mcq);}
  .q-card.tf .opt.selected{border-color:var(--tf);background:color-mix(in srgb, var(--tf) 10%, var(--paper));}
  .q-card.tf .opt.selected .circle{border-color:var(--tf);}
  .q-card.tf .opt.selected .circle::after{background:var(--tf);}
  .tf-row{display:flex;gap:10px;}
  .tf-row .opt{flex:1;justify-content:center;}
  .term-input{
    width:100%;
    padding:13px 14px;
    border-radius:11px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    outline:none;
  }
  .term-input:focus{border-color:var(--term);}

  /* Result review */
  .q-feedback{
    margin-top:10px;
    font-size:13.5px;
    font-weight:700;
    padding:9px 12px;
    border-radius:10px;
  }
  .q-feedback.correct{background:var(--good-bg);color:var(--good);}
  .q-feedback.wrong{background:var(--bad-bg);color:var(--bad);}
  .q-card.locked .opt{cursor:default;}
  .q-card.locked .opt.correct-answer{border-color:var(--good);background:var(--good-bg);}
  .q-card.locked .opt.wrong-answer{border-color:var(--bad);background:var(--bad-bg);}
  .q-card.locked .term-input.correct-answer{border-color:var(--good);background:var(--good-bg);}
  .q-card.locked .term-input.wrong-answer{border-color:var(--bad);background:var(--bad-bg);}

  /* Score screen */
  .score-hero{
    text-align:center;
    padding:10px 4px 4px;
  }
  .score-ring{
    width:150px;height:150px;border-radius:50%;
    margin:6px auto 14px;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    background:conic-gradient(var(--tf) calc(var(--pct) * 1%), var(--line) 0);
    position:relative;
  }
  .score-ring::before{
    content:"";
    position:absolute;inset:10px;
    border-radius:50%;
    background:var(--card);
  }
  .score-ring .num{position:relative;z-index:1;font-size:30px;font-weight:900;}
  .score-ring .lbl{position:relative;z-index:1;font-size:12px;color:var(--ink-soft);font-weight:700;}
  .stu-summary{
    display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
    color:var(--ink-soft);font-size:14px;font-weight:700;margin-bottom:6px;
  }
  .share-box{
    background:var(--paper);
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:14px;
    font-size:13.5px;
    white-space:pre-wrap;
    font-family:inherit;
    margin-top:14px;
    max-height:220px;
    overflow-y:auto;
    line-height:1.9;
  }
  .toast{
    position:fixed;
    bottom:22px;left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:#fff;
    padding:11px 20px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .progress-bar{
    height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:14px;
  }
  .progress-bar > div{height:100%;background:linear-gradient(90deg,var(--mcq),var(--tf));border-radius:999px;transition:width .25s;}

  .footer-note{
    text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:28px;
  }
  .hidden{display:none !important;}

  a.admin-link{
    display:block;text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:18px;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;width:100%;
  }
  table.admin-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  table.admin-table th, table.admin-table td{border:1px solid var(--line);padding:8px;text-align:center;}
  table.admin-table th{background:var(--paper);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- DATA ---------------- */
const TEACHER = "بشمهندس إسلام سليمان";
const SUBJECT = "البرمجة والذكاء الاصطناعي";
const GRADE = "الصف الثاني الثانوي - بكالوريا";

const BRANCHES = ["طنطا","كفر الشيخ","دسوق"];

/* ---------------- GOOGLE SHEET SUBMISSION (optional) ----------------
   To make every student's result land automatically in a Google Sheet:
   1) Create a Google Form with 5 short-answer fields in this order:
      الاسم / رقم الهاتف / الفرع / الدرجة / النسبة
   2) In the form's "Responses" tab, click the Sheets icon to link a spreadsheet.
   3) Click the ⋮ menu > "Get pre-filled link", fill each field with a
      placeholder (e.g. TEST1..TEST5), click "Get link" and copy it.
   4) Paste the copied link below as PREFILLED_LINK, OR fill FORM_ACTION_URL
      and ENTRY_IDS manually if you already know them.
   Leave FORM_ACTION_URL empty to keep the exam working WITHOUT a sheet.
------------------------------------------------------------------- */
const GOOGLE_FORM = {
  enabled:true,
  formActionUrl:"https://docs.google.com/forms/d/e/1FAIpQLScSa_VMXD3gw2N7sd35FrFLJtEidkf8UMqF_8BzT9av5_R8sg/formResponse",
  entryIds:{
    name:"entry.494899268",
    phone:"entry.1991400981",
    branch:"entry.757625710",
    score:"entry.1787641140",
    percent:"entry.862439723",
  }
};

function submitToGoogleSheet(payload){
  if(!GOOGLE_FORM.enabled || !GOOGLE_FORM.formActionUrl) return;
  try{
    const fd = new FormData();
    const ids = GOOGLE_FORM.entryIds;
    if(ids.name) fd.append(ids.name, payload.name);
    if(ids.phone) fd.append(ids.phone, payload.phone);
    if(ids.branch) fd.append(ids.branch, payload.branch);
    if(ids.score) fd.append(ids.score, String(payload.score));
    if(ids.percent) fd.append(ids.percent, String(payload.percent));
    fetch(GOOGLE_FORM.formActionUrl, {method:"POST", mode:"no-cors", body:fd}).catch(()=>{});
  }catch(e){}
}

// Multiple choice
const MCQ = [
  {q:"الملاحظة التجريبية التي تقول إن عدد الترانزستورات في الدائرة المتكاملة يتضاعف تقريبًا كل عامين تُسمّى:",
   opts:["قانون نيوتن","قانون أوم","قانون بويل","قانون مور"], correct:3},
  {q:"بيع السلع والخدمات وشراؤها عبر الإنترنت يُعرف بـ:",
   opts:["العمل عن بُعد","التجارة الإلكترونية","الدفع غير النقدي","شبكات التواصل الاجتماعي"], correct:1},
  {q:"أي عبارة تصف الواقع المعزز (AR) وصفًا صحيحًا؟",
   opts:["يضع المستخدم داخل بيئة افتراضية كاملة","يعتمد على الحوسبة الكمومية","يضيف عناصر رقمية فوق مشهد من العالم الحقيقي","يستخدم الذكاء الاصطناعي لقيادة المركبات"], correct:2},
  {q:"دفع قيمة السلع أو الخدمات دون استخدام النقد يُسمّى:",
   opts:["الدفع غير النقدي","التجارة الإلكترونية","العمل عن بُعد","شبكات التواصل الاجتماعي"], correct:0},
  {q:"أي مما يلي يُعد من التقنيات الناشئة؟",
   opts:["البريد الإلكتروني","الحواسب الشخصية","شبكات الهاتف التقليدية","القيادة الذاتية"], correct:3},
  {q:"ما المصطلح العام للأنظمة الحاسوبية القادرة على التعلم والتنبؤ والتوليد؟",
   opts:["التعلم الآلي","التعلم العميق","الذكاء الاصطناعي","الشبكات العصبية"], correct:2},
  {q:"أي من التالي فرع من الذكاء الاصطناعي تتعلم فيه النماذج الأنماط من البيانات؟",
   opts:["التعلم الآلي","التعلم العميق","الشبكات العصبية","الذكاء الاصطناعي التوليدي"], correct:0},
  {q:"عندما يُنتج الذكاء الاصطناعي التوليدي معلومات خاطئة تبدو مقنعة، تُسمّى هذه الظاهرة:",
   opts:["التحيز الخوارزمي","التشويش","التضخيم","الهلوسة"], correct:3},
  {q:"الأنظمة التي تُنشئ محتوى جديدًا مثل النصوص والصور تُعرف بـ:",
   opts:["الذكاء الاصطناعي التفاعلي","الذكاء الاصطناعي التوليدي","الذكاء الاصطناعي التنبؤي","الذكاء الاصطناعي التشغيلي"], correct:1},
  {q:"أي مكوّن في الشبكة العصبية الاصطناعية تتغير قيمته أثناء التدريب؟",
   opts:["المدخلات","المخرجات","الأوزان","الدوال"], correct:2},
  {q:"أي من التالي مثال على الذكاء الاصطناعي ضيق النطاق (Narrow AI)؟",
   opts:["نظام التعرف على الوجه","الذكاء العام الاصطناعي (AGI)","الذكاء الخارق","نموذج لغوي عام"], correct:0},
  {q:"النظام الذي يتنبأ بتفضيلاتك من سلوكك السابق ثم يعرض عليك اقتراحات يُسمّى:",
   opts:["المساعد الصوتي","الترجمة الآلية","التعرف على الوجه","نظام التوصية"], correct:3},
  {q:"في أي مجال يُستخدم الذكاء الاصطناعي بصورة أساسية لتشخيص الحالات من الصور؟",
   opts:["الزراعة","التصنيع","الرعاية الصحية","الخدمات اللوجستية"], correct:2},
  {q:"استخدام البيانات للتنبؤ بأعطال الآلات قبل حدوثها يُسمّى:",
   opts:["التشخيص بالصور","أتمتة الجودة","تحسين المسارات","الصيانة التنبؤية"], correct:3},
  {q:"في أي مما يلي يتفوق الذكاء الاصطناعي؟",
   opts:["الأحكام الأخلاقية","اتخاذ القرارات النهائية","اكتشاف الأنماط في البيانات","تحمل المسؤولية"], correct:2},
  {q:"غياب الوضوح حول كيفية وصول الذكاء الاصطناعي إلى قراراته يُعرف بـ:",
   opts:["الهلوسة","مشكلة الصندوق الأسود","التحيز","الخصوصية"], correct:1},
  {q:"أي من التالي تطبيق للذكاء الاصطناعي في الزراعة؟",
   opts:["تحسين مسارات التوصيل","التشخيص بالصور","أتمتة فحص الجودة","الكشف عن الآفات والأمراض"], correct:3},
  {q:"ما دور الحوسبة الطرفية (Edge Computing) في السيارات ذاتية القيادة؟",
   opts:["زيادة الاعتماد الكامل على السحابة","تقليل زمن الاستجابة بمعالجة البيانات محليًا","إبطاء اتخاذ القرار","الاستغناء عن أجهزة الاستشعار"], correct:1},
  {q:"أي مثال مما يلي يُعد تطبيقًا للذكاء الاصطناعي في الرعاية الصحية؟",
   opts:["ترجمة النصوص الأدبية","طباعة التقارير الورقية","إدارة حسابات التواصل الاجتماعي","تحليل الأشعة السينية للكشف عن الأمراض"], correct:3},
  {q:"ماذا يُقصد بالمصطلح AGI؟",
   opts:["الذكاء الاصطناعي الضيق","الذكاء الاصطناعي العام","الشبكات العصبية التلافيفية","التعلم المعزز"], correct:1},
  // ---- الدرس 4: القضايا الأخلاقية ----
  {q:"النمط في مخرجات الذكاء الاصطناعي الذي قد يؤدي إلى نتائج غير عادلة أو ضارة يُسمّى:",
   opts:["الهلوسة","التحيز الخوارزمي","الصندوق الأسود","XAI"], correct:1},
  {q:"أي مما يلي ليس سببًا من أسباب التحيز الخوارزمي؟",
   opts:["بيانات تدريب غير كافية عن سمات معينة","انعكاس نزعات تمييزية سابقة في البيانات","استخدام النظام في مهمة لم يُصمَّم لها","بطء معالجة النظام"], correct:3},
  {q:"ما المقصود ببيانات التدريب؟",
   opts:["الأمثلة التي يتعلم منها النظام أنماطه قبل استخدامه","القرارات التي يُصدرها النظام بعد التشغيل","بيانات المستخدم بعد انتهاء الاستخدام","التقارير التي تُكتب عن أداء النظام"], correct:0},

/* persist lightly per-device so a refresh doesn't lose progress */
function saveLocal(){
  try{
    localStorage.setItem("bac_ai_exam_state_v2", JSON.stringify(state));
  }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem("bac_ai_exam_state_v2");
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.mcqAns&&parsed.mcqAns.length===MCQ.length&&parsed.tfAns.length===TF.length&&parsed.termAns.length===TERM.length) state = Object.assign(state, parsed);
    }
  }catch(e){}
}

/* ---------------- HELPERS ---------------- */
function normalizeArabic(str){
  if(!str) return "";
  return str
    .replace(/[\u064B-\u0652]/g,"")   // diacritics
    .replace(/[إأآا]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .replace(/[^\u0600-\u06FF0-9a-zA-Z ]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();
}

function gradeTerm(idx){
  const t = TERM[idx];
  const norm = normalizeArabic(state.termAns[idx]);
  if(!norm) return false;
  return [t.keywords].concat(t.alt||[]).some(set => set.every(k => norm.includes(normalizeArabic(k))));
}

function computeScore(){
  let correct = 0;
  const detail = {mcq:[], tf:[], term:[]};
  MCQ.forEach((item,i)=>{
    const ok = state.mcqAns[i]===item.correct;
    if(ok) correct++;
    detail.mcq.push(ok);
  });
  TF.forEach((item,i)=>{
    const ok = state.tfAns[i]===item.correct;
    if(ok) correct++;
    detail.tf.push(ok);
  });
  TERM.forEach((item,i)=>{
    const ok = gradeTerm(i);
    if(ok) correct++;
    detail.term.push(ok);
  });
  return {correct, total:TOTAL_Q, detail};
}

function allAnswered(){
  if(state.mcqAns.some(a=>a===null)) return false;
  if(state.tfAns.some(a=>a===null)) return false;
  if(state.termAns.some(a=>!a || !a.trim())) return false;
  return true;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

        <div class="q-feedback ${ok?'correct':'wrong'}">${ok?'إجابة صحيحة ✔':'إجابة خاطئة — الصحيح: '+item.opts[item.correct]}</div>
      </div>
    `;
  });

  html += `<div class="section-head"><div class="dot tf">٢</div><h2>مراجعة: صح أم خطأ</h2></div>`;
  TF.forEach((item,i)=>{
    const userAns = state.tfAns[i];
    const ok = userAns===item.correct;
    html += `
      <div class="q-card tf locked">
        <div class="q-num">سؤال ${MCQ.length+i+1}</div>
        <div class="q-text">${item.q}</div>
        <div class="tf-row">
          <div class="opt ${item.correct===true?'correct-answer':(userAns===true && !ok?'wrong-answer':'')}"><span class="circle"></span><span>✔ صح</span></div>
          <div class="opt ${item.correct===false?'correct-answer':(userAns===false && !ok?'wrong-answer':'')}"><span class="circle"></span><span>✘ خطأ</span></div>
        </div>
        <div class="q-feedback ${ok?'correct':'wrong'}">${ok?'إجابة صحيحة ✔':'إجابة خاطئة — الصحيح: '+(item.correct?'صح':'خطأ')}</div>
      </div>
    `;
  });

  html += `<div class="section-head"><div class="dot term">٣</div><h2>مراجعة: مصطلحات</h2></div>`;
  TERM.forEach((item,i)=>{
    const ok = gradeTerm(i);
    html += `
      <div class="q-card term locked">
        <div class="q-num">سؤال ${MCQ.length+TF.length+i+1}</div>
        <div class="q-text">${item.q}</div>
        <input type="text" class="term-input ${ok?'correct-answer':'wrong-answer'}" value="${escapeHtml(state.termAns[i])}" disabled>
        <div class="q-feedback ${ok?'correct':'wrong'}">${ok?'إجابة صحيحة ✔':'الإجابة الصحيحة: '+item.answer}</div>
      </div>
    `;
  });

  html += `<div class="footer-note">جميع الحقوق محفوظة — ${TEACHER}</div>`;
  return html;
}

function buildShareText(){
  const r = state.lastResult;
  const pct = Math.round((r.correct/r.total)*100);
  return [
    `نتيجة امتحان ${SUBJECT}`,
    `الاسم: ${state.student.name}`,
    `الهاتف: ${state.student.phone}`,
    `الفرع: ${state.student.branch}`,
    `الدرجة: ${r.correct} / ${r.total} (${pct}%)`,
    `إعداد: ${TEACHER}`,
  ].join("\n");
}

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ---------------- HANDLERS ---------------- */
function attachHandlers(){
  if(state.screen==="register"){
    document.querySelectorAll(".branch-opt").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.student.branch = el.getAttribute("data-branch");
        saveLocal(); render();
      });
    });
    document.getElementById("in-name").addEventListener("input", e=>{
      state.student.name = e.target.value; saveLocal();
    });
    document.getElementById("in-phone").addEventListener("input", e=>{
      state.student.phone = e.target.value; saveLocal();
    });
    document.getElementById("btn-start").addEventListener("click", ()=>{
      const err = document.getElementById("reg-error");
      if(!state.student.name.trim() || !state.student.phone.trim() || !state.student.branch){
        err.textContent = "من فضلك أكمل الاسم ورقم الهاتف واختر الفرع قبل البدء.";
        err.style.display = "block";
        return;
      }
      err.style.display = "none";
      state.screen = "exam";
      saveLocal(); render();
    });
    const adminToggle = document.getElementById("admin-toggle");
    if(adminToggle){
      adminToggle.addEventListener("click", ()=>{
        state.adminOpen = !state.adminOpen;
        render();
      });
    }
  } else if(state.screen==="exam"){
    document.querySelectorAll('[data-type="mcq"]').forEach(el=>{
      el.addEventListener("click", ()=>{
        const qi = +el.getAttribute("data-qi");
        const oi = +el.getAttribute("data-oi");
        state.mcqAns[qi] = oi;
        saveLocal(); render();
      });
    });
    document.querySelectorAll('[data-type="tf"]').forEach(el=>{
      el.addEventListener("click", ()=>{
        const qi = +el.getAttribute("data-qi");
        const val = el.getAttribute("data-val")==="true";
        state.tfAns[qi] = val;
        saveLocal(); render();
      });
    });
    document.querySelectorAll('[data-type="term"]').forEach(el=>{
      el.addEventListener("input", ()=>{
        const qi = +el.getAttribute("data-qi");
        state.termAns[qi] = el.value;
        saveLocal();
      });
    });
    document.getElementById("btn-submit").addEventListener("click", ()=>{
      const err = document.getElementById("exam-error");
      if(!allAnswered()){
        err.textContent = "من فضلك أجب عن جميع الأسئلة قبل التسليم.";
        err.style.display = "block";
        err.scrollIntoView({behavior:"smooth", block:"center"});
        return;
      }
      err.style.display = "none";
      state.lastResult = computeScore();
      const pct = Math.round((state.lastResult.correct/state.lastResult.total)*100);
      submitToGoogleSheet({
        name: state.student.name,
        phone: state.student.phone,
        branch: state.student.branch,
        score: state.lastResult.correct + "/" + state.lastResult.total,
        percent: pct + "%",
      });
      state.screen = "result";
      saveLocal(); render();
    });
    document.getElementById("btn-back").addEventListener("click", ()=>{
      state.screen = "register";
      saveLocal(); render();
    });
  } else if(state.screen==="result"){
    document.getElementById("btn-copy").addEventListener("click", async ()=>{
      const text = buildShareText();
      try{
        await navigator.clipboard.writeText(text);
        showToast("تم نسخ النتيجة، يمكنك إرسالها للمدرس الآن");
      }catch(e){
        showToast("تعذر النسخ التلقائي، انسخ النص يدويًا");
      }
    });
    document.getElementById("btn-retry").addEventListener("click", ()=>{
      state.screen = "register";
      state.mcqAns = new Array(MCQ.length).fill(null);
      state.tfAns = new Array(TF.length).fill(null);
      state.termAns = new Array(TERM.length).fill("");
      state.lastResult = null;
      saveLocal(); render();
    });
  }
}

/* ---------------- INIT ---------------- */
loadLocal();
render();
</script>
</body>
</html>
